apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-backend
  template:
    metadata:
      labels:
        app: portfolio-backend
    spec:
      containers:
        - name: portfolio-backend
          image: nithinu08/nithinhomepage-backend:latest@sha256:901a5ac0d87f1d3540bf16fbe4d18e13b9d1053d4405f3c2717768ff3d3ed3c0
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_ENDPOINT
              value: "signoz-otel-collector.signoz.svc.cluster.local:4317"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
