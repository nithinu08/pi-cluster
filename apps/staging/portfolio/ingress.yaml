apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: nithinhomepage.com
      http:
        paths:
          - backend:
              service:
                name: portfolio-backend
                port:
                  number: 8080
            path: /api
            pathType: Prefix
          - backend:
              service:
                name: portfolio-frontend
                port:
                  number: 80
            path: /
            pathType: Prefix
